<!doctype html>
<html lang="en">
	<head>
		<title>Game</title>
		<meta charset="utf-8" />
		<script src="utils.js">
		</script>
		<script src="classes.js">
		</script>
		<script src="game.js">
		</script>
		<style>
			*{
				box-shizing: border-box;
			}
		</style>
	</head>
	<body>
		<!--red container-->
		<div style="position: relative; display: inline-block;">
			<!--smaller red container-->
			<div style="position: absolute; display: flex; width: 100%; align-items: center; padding: 20px;">
				<!--player health-->
				<div style="position: relative; height: 30px; width: 100%; display: flex; justify-content: flex-end;">
					<div style="background-color: yellow; height: 30px; width: 100%;"></div>
					<div id="playerHealth" style="position: absolute; background: blue; top: 0; right: 0; bottom: 0; left: 0; width: 100%;"></div>
				</div>
				<!--timer-->
				<div id="timer" style="backgrounf-color: red; hieght: 100px; width: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">10</div>
				<!--enemy health-->
				<div style="position: relative; height: 30px; width: 100%;">
					<div style="background-color: yellow; height: 30px;"></div>
					<div id="enemyHealth" style="position: absolute; background: blue; top: 0; right: 0; bottom: 0; left: 0;"></div>
				</div>
			</div>
			<div id="displayText" style="position: absolute; color: white; align-item: center; justify-content: center; top: 0; right: 0; bottom: 0; left: 0; display: none;">Tie</div>
			<canvas></canvas>
		</div>
	</body>
</html>
